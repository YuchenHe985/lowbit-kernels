name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  golden-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.1.3 pytest==8.3.3 pyflakes==3.2.0
      - name: Lint
        run: python -m pyflakes lowbit bench kaggle tests
      - name: Golden model and kernel bit-logic tests
        run: python -m pytest -q tests
